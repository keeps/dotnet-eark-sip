name: CI
on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

jobs:
  continuous-integration:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Run Tests
        run: dotnet test eark-sip-4net-tests/eark-sip-4net-tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Build Library
        run: dotnet build eark-sip-4net/eark-sip-4net.csproj --configuration Release --no-restore

      - name: Build CLI
        run: dotnet build eark-sip-4net-cli/eark-sip-4net-cli.csproj --configuration Release --no-restore
