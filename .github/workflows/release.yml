name: Release
on:
  push:
    tags:
      - "**"
    branches-ignore:
      - "**"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Projects
        run: dotnet build -c Release --no-restore

      - name: Run Tests
        run: dotnet test eark-sip-4net-tests/eark-sip-4net-tests.csproj -c Release --no-build --logger trx

      - name: Set NuGet Package Version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          [xml]$csproj = Get-Content eark-sip-4net/eark-sip-4net.csproj
          $csproj.Project.PropertyGroup[0].Version = $version
          $csproj.Save('eark-sip-4net/eark-sip-4net.csproj')

      - name: Pack NuGet Package
        run: dotnet pack eark-sip-4net/eark-sip-4net.csproj -c Release --no-build -o "./dist"

      # Validate nuget
      - name: Install nuget validator
        run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global

      # Validate metadata and content of the NuGet package
      # https://www.nuget.org/packages/Meziantou.Framework.NuGetPackageValidation.Tool#readme-body-tab
      # If some rules are not applicable, you can disable them
      # using the --excluded-rules or --excluded-rule-ids option
      - name: Validate package
        run: meziantou.validate-nuget-package "dist/eark-sip-4net.${{ github.ref_name }}.nupkg"

      # To publish to nuget.org (public!), would need a key
      - name: Publish the package to nuget.org
        run: dotnet nuget push "dist/eark-sip-4net.${{ github.ref_name }}.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json"

      - name: Publish CLI as a ZIP in a draft release
        run: |
          mkdir "cli_release"
          cp -r "eark-sip-4net-cli/bin/Release/*" "cli_release/"
          Compress-Archive -Path "cli_release/*" -DestinationPath "dist/eark-sip-4net-cli.zip"
          rm -r "cli_release"

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          name: Version ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ./dist/eark-sip-4net.${{ github.ref_name }}.nupkg
            ./dist/eark-sip-4net-cli.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
